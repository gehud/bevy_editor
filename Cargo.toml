[package]
name = "bevy_editor"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["samples/simple"]

[features]
default = ["documentation"]
documentation = ["bevy/reflect_documentation"]

[dependencies]
bevy = { git = "https://github.com/gehud/bevy.git", branch = "editor", features = [
    "debug",
    "track_location",
] }
bevy_egui = "0.39.1"
bevy_mod_outline = { git = "https://github.com/gehud/bevy_mod_outline.git" }
rusqlite = { version = "0.39.0", features = ["bundled", "chrono"] }
egui = { version = "0.33", features = ["serde", "persistence"] }
chrono = "0.4.44"
serde = { version = "1.0.228", features = ["derive"] }
paste = "1.0.15"
duplicate = "2.0.1"
smallvec = "1.15.1"
disqualified = "1.0.0"
opener = "0.8.4"
fuzzy-matcher = "0.3.7"
bytemuck = "1.25.0"
image = "0.25.10"
platform-dirs = "0.3.0"
ron = "0.12.1"

[patch.crates-io]
bevy = { git = "https://github.com/gehud/bevy.git", branch = "editor" }
