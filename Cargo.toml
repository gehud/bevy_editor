[package]
name = "bevy_editor"
version = "0.1.0"
edition = "2024"

[features]
default = ["custom_cursor"]
custom_cursor = ["bevy/custom_cursor"]

[dependencies]
bevy = { version = "0.18.1", features = [
    "debug",
    "experimental_bevy_ui_widgets",
] }
accesskit = { version = "0.21" }
variadics_please = { version = "1.1.0" }
